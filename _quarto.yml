# Site do forplotR --------------------------------------------------------------
#
# Quarto sem Bootstrap: template próprio (_tpl/page.html) e CSS com tokens
# (assets/site.css). Cada página é escrita uma vez, nas duas línguas, num
# _body.qmd; a página em português (/) e a em inglês (/en/) incluem o mesmo
# corpo e o filtro _tpl/lang.lua mantém só a língua da página.
#
#   scripts/sync_en.R    (pré) gera as páginas em inglês a partir das portuguesas
#   scripts/seo.R        (pós) canonical, hreflang, JSON-LD, sitemap, robots,
#                        llms.txt e redirecionamentos dos endereços antigos
#
# Saída em _site/: publicada no GitHub Pages pelo workflow build-webr.yml e
# servida pelo modo servidor (backend/plumber.R).

project:
  type: website
  output-dir: _site
  pre-render: scripts/sync_en.R
  post-render: scripts/seo.R
  render:
    - index.qmd
    - comecar/index.qmd
    - aplicacoes/**/index.qmd
    - ferramentas/**/index.qmd
    - referencia/index.qmd
    - autoria/index.qmd
    - citar/index.qmd
    - sobre/index.qmd
    - novidades/index.qmd
    - perguntas/index.qmd
    - en/**/index.qmd
  resources:
    - assets/
    - js/
    - figures/
    - fonts/
    - exemplos/
    - "!_tools/"

lang: pt-BR

website:
  title: "forplotR"
  site-url: "https://dboslab.github.io/forplotR-website/"
  description: "forplotR: pacote R para dados de parcelas florestais permanentes e documentação de espécimes de herbário."

format:
  html:
    theme: none
    minimal: true
    template: _tpl/page.html
    filters:
      - _tpl/lang.lua
    toc: false
    toc-depth: 2
    highlight-style: none
    link-external-newwindow: false
    anchor-sections: false
    code-copy: false
    title-prefix: ""

execute:
  freeze: auto

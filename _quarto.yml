# Site do forplotR --------------------------------------------------------------
#
# Quarto sem Bootstrap: template próprio (_tpl/page.html) e CSS com tokens
# (assets/site.css). Cada página é escrita uma vez, nas duas línguas, em
# pt/<caminho>/_body.qmd. O inglês é o idioma padrão e fica na raiz; o português
# fica em /pt/. As duas versões incluem o mesmo corpo e o filtro _tpl/lang.lua
# mantém só a língua da página.
#
#   scripts/sync_lang.R  (pré) gera as páginas em inglês (raiz) a partir de pt/
#   scripts/seo.R        (pós) canonical, hreflang, JSON-LD, sitemap, robots,
#                        llms.txt e redirecionamentos dos endereços antigos
#
# Saída em _site/: publicada no GitHub Pages pelo workflow build-webr.yml e
# servida pelo modo servidor (backend/plumber.R).

project:
  type: website
  output-dir: _site
  pre-render: scripts/sync_lang.R
  post-render: scripts/seo.R
  render:
    - index.qmd
    - get-started/index.qmd
    - applications/**/index.qmd
    - formats/index.qmd
    - tools/**/index.qmd
    - reference/index.qmd
    - authors/index.qmd
    - cite/index.qmd
    - about/index.qmd
    - news/index.qmd
    - faq/index.qmd
    - license/index.qmd
    - pt/**/index.qmd
  resources:
    - assets/
    - js/
    - figures/
    - fonts/
    - exemplos/
    - "!_tools/"

lang: en
# idioma padrão inglês; pt/_metadata.yml muda para português (lang-en: false)
lang-en: true

website:
  title: "forplotR"
  site-url: "https://dboslab.github.io/forplotR-website/"
  description: "forplotR: an R package and browser app to manage the botanical collections of permanent vegetation monitoring plots."
  # a busca do site é a do Pagefind (_tools); o índice do Quarto não é usado
  search: false

format:
  html:
    theme: none
    minimal: true
    template: _tpl/page.html
    filters:
      - _tpl/lang.lua
    toc: false
    toc-depth: 2
    highlight-style: none
    link-external-newwindow: false
    anchor-sections: false
    code-copy: false
    title-prefix: ""

execute:
  freeze: auto

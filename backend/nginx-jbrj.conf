# Exemplo para o nginx do JBRJ publicar o forplotR online.
# Opção A — subdomínio próprio (recomendado), ex.: forplotr.jbrj.gov.br
server {
    listen 443 ssl http2;
    server_name forplotr.jbrj.gov.br;
    # ssl_certificate     ...;
    # ssl_certificate_key ...;

    client_max_body_size 210m;          # um pouco acima de FORPLOTR_MAX_UPLOAD_MB

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;        # o envio de ZIPs grandes pode demorar
        proxy_send_timeout 300s;
    }
}


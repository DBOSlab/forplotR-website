<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Tudo vem da própria origem: nenhuma requisição a terceiros. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="robots" content="noindex">
<title>forplotR webR — teste</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 16px; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  td, th { border-bottom: 1px solid #ddd; padding: .35rem .5rem; text-align: left; }
  td.t { text-align: right; font-variant-numeric: tabular-nums; }
  pre { background: #f5f5f2; padding: .75rem; overflow: auto; max-height: 22rem; font-size: 13px; }
  .ok { color: #1b7f3b; } .bad { color: #b42318; }
  button { font: inherit; padding: .4rem .9rem; }
</style>
</head>
<body>
<h1>forplotR no navegador: teste de fumaça</h1>
<p>Página interna de desenvolvimento (não aparece no menu). Mede cada etapa e roda
<code>forplot_vouchers()</code> com o exemplo RUS01, sem enviar nada para fora do navegador.</p>
<button id="go">Iniciar teste</button>
<table><thead><tr><th>Etapa</th><th>Tempo (s)</th><th>Situação</th></tr></thead><tbody id="steps"></tbody></table>
<h2>Saída do R</h2>
<pre id="log"></pre>
<script type="module">
import { WebR, ChannelType } from '../webr/runtime/webr.mjs';

const steps = document.getElementById('steps');
const logEl = document.getElementById('log');
const log = (s) => { logEl.textContent += s + '\n'; logEl.scrollTop = logEl.scrollHeight; };
const repo = new URL('../webr/repo/', location.href).href;

async function step(name, fn) {
  const tr = steps.insertRow();
  tr.insertCell().textContent = name;
  const t = tr.insertCell(); t.className = 't';
  const s = tr.insertCell(); s.textContent = '…';
  const t0 = performance.now();
  try {
    const r = await fn();
    t.textContent = ((performance.now() - t0) / 1000).toFixed(1);
    s.textContent = 'ok'; s.className = 'ok';
    return r;
  } catch (e) {
    t.textContent = ((performance.now() - t0) / 1000).toFixed(1);
    s.textContent = String(e.message || e); s.className = 'bad';
    throw e;
  }
}

async function run(webR, code) {
  const shelter = await new webR.Shelter();
  try {
    const res = await shelter.captureR(code, { withAutoprint: true, captureStreams: true, captureConditions: false });
    res.output.forEach((o) => log((o.type === 'stderr' ? '! ' : '') + o.data));
  } finally {
    shelter.purge();
  }
}

document.getElementById('go').addEventListener('click', async (ev) => {
  ev.target.disabled = true;
  try {
    const webR = await step('Iniciar webR', async () => {
      const w = new WebR({ baseUrl: new URL('../webr/runtime/', location.href).href,
                           channelType: ChannelType.PostMessage, repoUrl: repo });
      await w.init();
      return w;
    });
    // A instalação usa a rede (mesma origem); a trava vem depois dela.
    await step('Instalar forplotR + dependências', () =>
      webR.installPackages(['forplotR'], { repos: [repo], quiet: true }));
    await step('Trava de rede no R', () => run(webR, `
      local({
        blocked <- function(...) stop("Acesso à rede desativado no modo local do forplotR.", call. = FALSE)
        for (nm in c("download.file", "url")) {
          env <- if (nm == "url") baseenv() else asNamespace("utils")
          unlockBinding(nm, env); assign(nm, blocked, envir = env); lockBinding(nm, env)
        }
        options(forplotR.offline = TRUE)
      })
      cat("rede bloqueada:", inherits(try(utils::download.file("https://example.org", tempfile()), silent = TRUE), "try-error"), "\\n")`));
    await step('library(forplotR)', () => run(webR, `
      suppressPackageStartupMessages(library(forplotR))
      cat("forplotR", format(packageVersion("forplotR")), "|", R.version.string, "\\n")
      cat("namespaces carregados:", length(loadedNamespaces()), "\\n")`));
    await step('Capacidades (png, pandoc)', () => run(webR, `
      print(capabilities()[c("png", "cairo")])
      cat("pandoc disponível:", rmarkdown::pandoc_available(), "\\n")`));
    await step('forplot_vouchers(RUS01)', () => run(webR, `
      e <- new.env(); utils::data("RUS01", package = "forplotR", envir = e)
      f <- file.path(tempdir(), "rus01.xlsx"); openxlsx::write.xlsx(e$RUS01, f)
      out <- file.path(tempdir(), "voucher_imgs")
      forplotR::forplot_vouchers(fp_file_path = f, output_dir = out, verbose = FALSE)
      d <- list.dirs(out, recursive = TRUE)
      cat(length(d), "pastas criadas; exemplo:", head(sub(paste0(out, "/"), "", d[-1]), 3), sep = "\\n")
      unlink(c(f, out), recursive = TRUE)`));
  } catch (e) {
    log('Erro: ' + (e.message || e));
  }
});
</script>
</body>
</html>

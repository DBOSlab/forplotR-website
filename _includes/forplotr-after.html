<!-- forplotR: comportamento comum a todas as páginas.
     1. Idioma PT/EN: elementos com data-lang="pt" | "en"; textos gerados pelo Quarto
        (sumário, busca, navegação, botão de copiar) traduzidos pelo dicionário CHROME.
     2. Tema claro/escuro: html[data-theme], preferência em localStorage (forplotR_theme).
     3. Botões [data-copy]: copiam o texto de um elemento, com estado de confirmação.
     Evento "fp:lang" avisa outros scripts (js/forplotr-app.js) quando o idioma muda. -->
<script>
(function () {
  'use strict';
  var root = document.documentElement;
  var LKEY = 'forplotR_lang', TKEY = 'forplotR_theme';

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lang() { return root.classList.contains('fp-en') ? 'en' : 'pt'; }

  // ---------- textos do Quarto (PT -> EN) ----------
  var CHROME = {
    'Nesta página': 'On this page',
    'Funções': 'Functions',
    'Ajuda': 'Help',
    'Documentação': 'Documentation',
    'Voltar ao topo': 'Back to top',
    'Copiar': 'Copy',
    'Copiado!': 'Copied',
    'Nota': 'Note',
    'Buscar': 'Search',
    'Cancelar': 'Cancel',
    'Limpar': 'Clear',
    'Nenhum resultado': 'No results'
  };
  var CHROME_SEL = '#toc-title, .sidebar-item-section > .sidebar-item-container .menu-text, ' +
    '.sidebar-title, .breadcrumb-item a, #quarto-back-to-top, .callout .screen-reader-only, ' +
    '.aa-DetachedSearchButtonPlaceholder, .aa-DetachedCancelButton, .tippy-content';

  function translateChrome(scope) {
    var en = lang() === 'en';
    (scope || document).querySelectorAll(CHROME_SEL).forEach(function (el) {
      // só nós de texto diretos (preserva ícones dentro do elemento)
      el.childNodes.forEach(function (n) {
        if (n.nodeType !== 3) return;
        var orig = n.__fpPt || n.nodeValue.trim();
        if (!n.__fpPt && CHROME[orig]) n.__fpPt = orig;
        if (!n.__fpPt) return;
        var want = en ? CHROME[n.__fpPt] : n.__fpPt;
        if (n.nodeValue.trim() !== want) n.nodeValue = n.nodeValue.replace(n.nodeValue.trim(), want);
      });
    });
    document.querySelectorAll('.code-copy-button').forEach(function (b) {
      b.title = en ? 'Copy' : 'Copiar'; b.setAttribute('aria-label', b.title);
    });
  }

  // ---------- idioma ----------
  function setLang(l) {
    root.classList.toggle('fp-en', l === 'en');
    root.lang = l === 'en' ? 'en' : 'pt-BR';
    store(LKEY, l);
    document.querySelectorAll('[data-set-lang]').forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-set-lang') === l ? 'true' : 'false');
    });
    var tb = document.querySelector('.theme-btn');
    if (tb) updateThemeLabel(tb);
    translateChrome();
    document.dispatchEvent(new CustomEvent('fp:lang', { detail: { lang: l } }));
  }

  // ---------- tema ----------
  function theme() { return root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function updateThemeLabel(b) {
    var en = lang() === 'en', dark = theme() === 'dark';
    var t = dark ? (en ? 'Switch to light theme' : 'Usar tema claro') : (en ? 'Switch to dark theme' : 'Usar tema escuro');
    b.setAttribute('aria-label', t); b.title = t;
    b.setAttribute('aria-pressed', dark ? 'true' : 'false');
  }
  function setTheme(t, persist) {
    root.setAttribute('data-theme', t);
    if (persist) store(TKEY, t);
    var b = document.querySelector('.theme-btn');
    if (b) updateThemeLabel(b);
  }
  // segue o sistema enquanto não houver escolha explícita
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var follow = function (e) {
      var saved = null; try { saved = localStorage.getItem(TKEY); } catch (x) {}
      if (saved !== 'light' && saved !== 'dark') setTheme(e.matches ? 'dark' : 'light', false);
    };
    if (mq.addEventListener) mq.addEventListener('change', follow); else if (mq.addListener) mq.addListener(follow);
  }

  // ---------- controles no menu ----------
  var tools = document.querySelector('#quarto-header .quarto-navbar-tools') ||
              document.querySelector('#quarto-header .navbar-collapse');
  if (tools && !document.querySelector('.fp-prefs')) {
    var box = document.createElement('div');
    box.className = 'fp-prefs';
    box.innerHTML =
      '<div class="seg" role="group" aria-label="Idioma / Language">' +
        '<button type="button" data-set-lang="pt" lang="pt-BR">PT</button>' +
        '<button type="button" data-set-lang="en" lang="en">EN</button>' +
      '</div>' +
      '<button type="button" class="icon-btn theme-btn">' +
        '<svg class="i-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M13.5 9.8A5.8 5.8 0 0 1 6.2 2.5a5.8 5.8 0 1 0 7.3 7.3Z" stroke-linejoin="round"/></svg>' +
        '<svg class="i-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3" stroke-linecap="round"/></svg>' +
      '</button>';
    tools.insertBefore(box, tools.firstChild);
  }
  document.querySelectorAll('[data-set-lang]').forEach(function (b) {
    b.addEventListener('click', function () { setLang(b.getAttribute('data-set-lang')); });
  });
  var tbtn = document.querySelector('.theme-btn');
  if (tbtn) tbtn.addEventListener('click', function () { setTheme(theme() === 'dark' ? 'light' : 'dark', true); });

  // ---------- copiar (citação etc.) ----------
  document.querySelectorAll('[data-copy]').forEach(function (b) {
    var original = b.innerHTML;
    b.addEventListener('click', function () {
      var src = document.querySelector(b.getAttribute('data-copy'));
      if (!src) return;
      var txt = src.textContent.replace(/\s+/g, ' ').trim();
      var done = function () {
        b.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m3 8.5 3 3 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '<span>' + (lang() === 'en' ? b.getAttribute('data-done-en') : b.getAttribute('data-done-pt')) + '</span>';
        b.disabled = true;
        setTimeout(function () { b.innerHTML = original; b.disabled = false; }, 2000);
      };
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, function () { window.prompt('', txt); });
      else { window.prompt('', txt); }
    });
  });

  // textos que o Quarto cria depois (busca, dicas do botão copiar)
  if (window.MutationObserver) {
    new MutationObserver(function (muts) {
      if (lang() !== 'en') return;
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) translateChrome(n.parentNode || n); }); });
    }).observe(document.body, { childList: true, subtree: true });
  }

  setLang(lang());
  setTheme(theme(), false);
})();
</script>

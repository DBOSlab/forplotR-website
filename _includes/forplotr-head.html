<!-- forplotR online: onde está a API.
     "/v1" = mesmo endereço do site (servidor do JBRJ ou backend/iniciar.R).
     Se o site for publicado numa subpasta (ex.: /forplotr/), use "/forplotr/v1".
     Durante o `quarto preview` o script usa http://127.0.0.1:8000/v1 automaticamente. -->
<meta name="forplotr-api" content="/v1">
<meta name="color-scheme" content="light dark">
<!-- Idioma (PT/EN) e tema (claro/escuro) aplicados antes de desenhar a página, sem "piscar".
     Preferências guardadas em localStorage: forplotR_lang ("pt" | "en") e
     forplotR_theme ("light" | "dark"); sem preferência, o tema segue o sistema. -->
<script>
(function () {
  var root = document.documentElement, lang = null, theme = null;
  try { lang = localStorage.getItem('forplotR_lang'); theme = localStorage.getItem('forplotR_theme'); } catch (e) {}
  // ?lang=en|pt e ?theme=dark|light na URL têm precedência (links compartilháveis)
  var q = /[?&]lang=(en|pt)\b/.exec(location.search); if (q) { lang = q[1]; try { localStorage.setItem('forplotR_lang', lang); } catch (e) {} }
  var t = /[?&]theme=(dark|light)\b/.exec(location.search); if (t) theme = t[1];
  if (lang === 'en') { root.classList.add('fp-en'); root.lang = 'en'; }
  if (theme !== 'light' && theme !== 'dark') {
    theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  root.setAttribute('data-theme', theme);
})();
</script>

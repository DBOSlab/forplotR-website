# Grafo de entidades do site (SEO e GEO) ---------------------------------------
#
# Fonte única dos fatos sobre o forplotR, a autoria e as instituições. O script
# scripts/seo.R lê este arquivo depois da renderização e gera, em cada página,
# o JSON-LD (schema.org), as meta tags de citação e de compartilhamento, e os
# arquivos sitemap.xml, robots.txt, llms.txt e llms-full.txt.
#
# Regras:
# - só fatos verificáveis; campo desconhecido fica vazio (null) e o script o omite;
# - nada de e-mail ou outro dado de contato pessoal;
# - os nomes aparecem sempre na mesma forma, para que buscadores e modelos de
#   linguagem reconheçam a mesma pessoa em todas as páginas (e no ORCID).

site:
  url: "https://dboslab.github.io/forplotR-website/"
  name: "forplotR"
  image: "figures/forplotR_hex_sticker.png"
  locale_pt: "pt_BR"
  locale_en: "en"

software:
  name: "forplotR"
  alternate_name: "forplotR R package"
  version: "1.0.0"
  license: "https://opensource.org/licenses/MIT"
  code_repository: "https://github.com/DBOSlab/forplotR"
  issue_tracker: "https://github.com/DBOSlab/forplotR/issues"
  programming_language: "R"
  runtime: "R (>= 4.1.0); webR (R em WebAssembly) no navegador"
  date_published: "2025"
  keywords: ["R", "forest plots", "parcelas florestais permanentes", "ForestPlots.net",
             "MONITORA", "herbário", "herbarium", "vouchers", "exsicatas", "JABOT",
             "BRAHMS", "Darwin Core", "webR", "Mata Atlântica", "Amazônia"]
  description_pt: >-
    Pacote R que integra os dados de censos de parcelas florestais permanentes
    (ForestPlots.net e programa MONITORA) à documentação dos espécimes botânicos:
    mapa interativo da parcela, balanço de coleta, organização das fotos dos
    vouchers, planilhas de etiquetas de herbário (JABOT, BRAHMS) e cruzamento das
    determinações de campo com o herbário.
  description_en: >-
    R package that links permanent forest plot census data (ForestPlots.net and
    the Brazilian MONITORA programme) to the documentation of botanical
    specimens: interactive plot maps, collection-balance reports, voucher photo
    organisation, herbarium label spreadsheets (JABOT, BRAHMS) and cross-checks of
    field determinations against herbarium records.
  funders: ["CNPq", "CAPES"]

